spring.application.name=sistema-produto

# Configurações do banco de dados
spring.datasource.url=jdbc:h2:mem:produtosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita o console e define a url de acesso ao console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Exibe o sql e atualiza a estrutura dp banco
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Garante que o schema dp banco seja criado antes da execução dp sqç
spring.jpa.defer-datasource-initialization=true
