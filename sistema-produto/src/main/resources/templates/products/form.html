<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: html}">
<head th:replace="~{layout :: head(title=${product.id} ? 'Editar Produto' : 'Novo Produto')}"></head>
<body>
    <main th:replace="~{layout :: content}">
        <h2 th:text="${product.id} ? 'Editar Produto' : 'Novo Produto'"></h2>

        <form th:action="@{/products}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}">

            <!-- Campo Nome -->
            <div class="form-group">
                <label>Nome:</label>
                <input type="text" th:field="*{name}" class="form-control">
                <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
            </div>

            <!-- Campo Preço -->
            <div class="form-group">
                <label>Preço (R$):</label>
                <input type="number" step="0.01" th:field="*{price}" class="form-control">
                <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="error"></span>
            </div>

            <!-- Campo Descrição -->
            <div class="form-group">
                <label>Descrição:</label>
                <textarea th:field="*{description}" class="form-control"></textarea>
            </div>

            <!-- Botões -->
            <div class="form-actions">
                <button type="submit" class="btn-save">💾 Salvar</button>
                <a th:href="@{/products}" class="btn-cancel">❌ Cancelar</a>
            </div>
        </form>
    </main>
</body>
</html>
